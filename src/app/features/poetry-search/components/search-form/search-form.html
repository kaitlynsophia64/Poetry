<form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="search-form">
  <p class="form-hint">Enter author, title, or both to search</p>

  <div class="form-group">
    <label for="author" class="form-label">Author:</label>
    <input
      id="author"
      type="text"
      formControlName="author"
      class="form-input"
      placeholder="e.g., Shakespeare"
    />
  </div>

  <div class="form-group">
    <label for="title" class="form-label">Title:</label>
    <input
      id="title"
      type="text"
      formControlName="title"
      class="form-input"
      placeholder="e.g., Sonnet"
    />
  </div>

  @if (validationError) {
    <div class="error-text">{{ validationError }}</div>
  }

  <button
    type="submit"
    class="submit-button"
  >
    Search
  </button>
</form>
